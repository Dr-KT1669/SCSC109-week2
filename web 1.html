<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Doggo Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top left, #1e1e2f, #0d0d15);
      color: #fff;
      overflow-x: hidden;
    }

    /* Glassmorphism Container sd*/
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(0, 242, 254, 0.4);
    }

    /* Animated Gradient Title */
    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    /* Image Wrapper with Neon Glow */
    .img-wrapper {
      position: relative;
      display: inline-block;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 242, 254, 0.2);
    }

    .img-wrapper img {
      display: block;
      width: 100%;
      max-width: 320px;
      height: 240px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .img-wrapper img {
      transform: scale(1.06);
    }

    /* Interactive Elements */
    .stats {
      font-size: 0.95rem;
      color: #a0aec0;
      margin-bottom: 20px;
    }

    .stats span {
      color: #00F2FE;
      font-weight: bold;
    }

    button {
      background: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
      color: #0d0d15;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
      transition: all 0.25s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Cyber Doggo ⚡</h1>
    
    <div class="img-wrapper">
      <img src="หมา.png" alt="A cute dog">
    </div>

    <p class="stats">Pat Counter: <span id="patCount">0</span> ครั้ง</p>
    
    <button onclick="patDog()">👋 Pat the Dog</button>
  </div>

  <script>
    let count = 0;
    function patDog() {
      count++;
      document.getElementById('patCount').innerText = count;
    }
  </script>

</body>
</html>
